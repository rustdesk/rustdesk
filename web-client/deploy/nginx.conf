# Terminate TLS once, then hand the page and the WebSocket to the gateway.
# Replace the certificate paths. proxy_read_timeout stays long because a
# remote-desktop socket is idle between frames.

server {
    listen 443 ssl;
    server_name desk.example.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:21119;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
