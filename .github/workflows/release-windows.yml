# Builds the Windows portable exe and publishes it as a GitHub release.
# Push a tag like v1.0.0 (or run it manually) to trigger it.
name: Release Windows portable

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_TRIPLET: x64-windows-static

jobs:
  windows-portable:
    runs-on: windows-2022
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}
          directory: C:/Program Files/LLVM

      - name: Install flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Replace engine with rustdesk custom flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/* C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: release-windows

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: ${{ env.VCPKG_TRIPLET }}
        shell: bash
        run: |
          $VCPKG_ROOT/vcpkg install \
            --triplet ${{ env.VCPKG_TRIPLET }} \
            --x-install-root="$VCPKG_ROOT/installed"

      - name: Cache bridge tools
        id: cache-bridge-tools
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: |
            ~/.cargo/bin/cargo-expand.exe
            ~/.cargo/bin/flutter_rust_bridge_codegen.exe
          key: bridge-tools-${{ env.CARGO_EXPAND_VERSION }}-${{ env.FLUTTER_RUST_BRIDGE_VERSION }}

      - name: Install flutter rust bridge tools
        if: steps.cache-bridge-tools.outputs.cache-hit != 'true'
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          cargo +stable install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo +stable install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked

      - name: Generate flutter rust bridge
        shell: bash
        run: |
          (cd flutter && flutter pub get)
          flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h

      - name: Prepare release build
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          UPDATE_SIGNING_SEED: ${{ secrets.UPDATE_SIGNING_SEED }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must look like v1.2.3, got ${GITHUB_REF_NAME}"
            exit 1
          fi
          if [ -z "$UPDATE_SIGNING_SEED" ]; then
            echo "::error::Add the UPDATE_SIGNING_SEED repository secret (base64 of a random 32-byte Ed25519 seed)."
            exit 1
          fi
          pip3 install cryptography
          # The app's version decides what counts as an update, so it must equal the tag.
          python3 - "$VERSION" <<'PY'
          import re, sys
          v = sys.argv[1]
          for path, pattern in (("Cargo.toml", r'(?m)^version = "[^"]*"'), ("Cargo.lock", r'(name = "rustdesk"\r?\nversion = )"[^"]*"')):
              text = open(path, encoding="utf-8", newline="").read()
              repl = f'version = "{v}"' if path == "Cargo.toml" else rf'\g<1>"{v}"'
              text, n = re.subn(pattern, repl, text, count=1)
              assert n == 1, path
              open(path, "w", encoding="utf-8", newline="").write(text)
          PY
          PUBLIC_KEY=$(python3 - <<'PY'
          import base64, os
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric import ed25519
          key = ed25519.Ed25519PrivateKey.from_private_bytes(base64.b64decode(os.environ["UPDATE_SIGNING_SEED"]))
          raw = key.public_key().public_bytes(serialization.Encoding.Raw, serialization.PublicFormat.Raw)
          print(base64.b64encode(raw).decode())
          PY
          )
          echo "FORK_UPDATE_REPO=${GITHUB_REPOSITORY}" >> "$GITHUB_ENV"
          echo "FORK_UPDATE_PUBLIC_KEY=${PUBLIC_KEY}" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Build rustdesk
        run: python3 .\build.py --flutter --skip-portable-pack --hwcodec --vram

      - name: Pack portable exe
        shell: bash
        run: |
          VERSION="${RELEASE_VERSION:-dev}"
          cd libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../flutter/build/windows/x64/runner/Release -o . -e ../../flutter/build/windows/x64/runner/Release/rustdesk.exe
          cd ../..
          mkdir dist
          cp target/release/rustdesk-portable-packer.exe "dist/rustdesk-${VERSION}-x86_64.exe"
          # Same binary; a name ending in install.exe makes it start the installer when run.
          cp target/release/rustdesk-portable-packer.exe "dist/rustdesk-${VERSION}-install.exe"
          (cd flutter/build/windows/x64/runner/Release && 7z a -tzip "../../../../../../dist/rustdesk-${VERSION}-windows-x86_64.zip" .)

      - name: Sign update metadata
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          RUSTDESK_UPDATE_ED25519_SEED: ${{ secrets.UPDATE_SIGNING_SEED }}
        run: |
          python3 res/update/generate_update_metadata.py sign \
            --artifact windows x86_64 exe "dist/rustdesk-${RELEASE_VERSION}-x86_64.exe" \
            --version "$RELEASE_VERSION" --release-id "$GITHUB_REF_NAME" \
            --package-id rustdesk \
            --release-base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download" \
            --published-at "$(git log -1 --format=%cI)" \
            --metadata-out dist/rustdesk-update.json \
            --signature-out dist/rustdesk-update.json.sig
          RUSTDESK_UPDATE_ED25519_PUBLIC_KEY="$FORK_UPDATE_PUBLIC_KEY" \
          python3 res/update/generate_update_metadata.py verify \
            --metadata dist/rustdesk-update.json \
            --signature dist/rustdesk-update.json.sig \
            --artifact "dist/rustdesk-${RELEASE_VERSION}-x86_64.exe" \
            --version "$RELEASE_VERSION" --release-id "$GITHUB_REF_NAME" \
            --package-id rustdesk \
            --release-base-url "https://github.com/${GITHUB_REPOSITORY}/releases/download"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustdesk-windows-x86_64
          path: dist

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          generate_release_notes: true
          files: dist/*
