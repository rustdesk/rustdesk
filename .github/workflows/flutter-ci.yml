name: Full Flutter CI

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
    - "docs/**"
    - "README.md"
  push:
    branches:
      - master
      - experimental/flutter-official-windowing
    paths-ignore:
      - ".github/**"
      - "docs/**"
      - "README.md"
      - "res/**"
      - "appimage/**"
      - "flatpak/**"

# Keep the release and upstream PR behavior independent of the preview branch.
concurrency:
  group: full-flutter-ci-${{ github.ref == 'refs/heads/experimental/flutter-official-windowing' && github.ref || github.run_id }}

jobs:
  run-ci:
    uses: ./.github/workflows/flutter-build.yml
    with:
      upload-artifact: false
      desktop-windowing-preview: ${{ github.ref_name == 'experimental/flutter-official-windowing' }}
