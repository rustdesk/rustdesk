name: RDH macOS Candidate Build

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch or tag containing the RDH candidate source
        required: true
        default: "master"
      rdh_revision:
        description: RDH revision for this upstream version
        required: true
        default: "1"

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.24.5"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  MAC_RUST_VERSION: "1.81"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"

jobs:
  build-macos-herbin:
    name: build macOS aarch64 RustDesk-Herbin
    runs-on: macos-14
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_ref }}
          submodules: recursive

      - name: Resolve candidate version
        env:
          RDH_REVISION: ${{ inputs.rdh_revision }}
        run: |
          UPSTREAM_VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          test -n "$UPSTREAM_VERSION"
          test -n "$RDH_REVISION"
          echo "UPSTREAM_VERSION=$UPSTREAM_VERSION" >> "$GITHUB_ENV"
          echo "RDH_REVISION=$RDH_REVISION" >> "$GITHUB_ENV"
          echo "VERSION=${UPSTREAM_VERSION}-rdh.${RDH_REVISION}" >> "$GITHUB_ENV"
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Verify RDH patch invariants
        run: |
          python3 tests/test_herbin_branding.py
          git diff --check

      - name: Install build runtime
        run: |
          brew install llvm create-dmg nasm pkg-config

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Patch Flutter
        run: |
          cd "$(dirname "$(dirname "$(which flutter)")")"
          if [ "${FLUTTER_VERSION}" = "3.24.5" ]; then
            git apply "${GITHUB_WORKSPACE}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"
          fi

      - name: Workaround for Flutter frame issue
        run: |
          cd "$(dirname "$(which flutter)")"
          sed -i -e 's/_setFramesEnabledState(false);/\/\/_setFramesEnabledState(false);/g' ../packages/flutter/lib/src/scheduler/binding.dart

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: ${{ env.MAC_RUST_VERSION }}
          targets: aarch64-apple-darwin
          components: rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          prefix-key: macos-herbin-aarch64

      - name: Install Flutter Rust Bridge
        run: |
          cargo install flutter_rust_bridge_codegen --version "${FLUTTER_RUST_BRIDGE_VERSION}" --features uuid --locked
          pushd flutter
          flutter pub get
          popd
          ~/.cargo/bin/flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h

      - name: Setup vcpkg with GitHub Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        run: |
          if ! "$VCPKG_ROOT/vcpkg" install --x-install-root="$VCPKG_ROOT/installed"; then
            find "$VCPKG_ROOT/" -name "*.log" -print -exec cat {} \;
            exit 1
          fi

      - name: Test RDH headless terminal CLI
        run: |
          MACOSX_DEPLOYMENT_TARGET=10.14 \
            cargo test --locked --lib headless_terminal \
              --features flutter,hwcodec,unix-file-copy-paste,screencapturekit \
              -- --nocapture

      - name: Build RustDesk-Herbin for macOS
        run: |
          MIN_MACOS_VERSION="12.3"
          sed -i -e "s/MACOSX_DEPLOYMENT_TARGET\=[0-9]*.[0-9]*/MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}/" build.py
          sed -i -e "s/platform :osx, '.*'/platform :osx, '${MIN_MACOS_VERSION}'/" flutter/macos/Podfile
          sed -i -e "s/osx_minimum_system_version = \"[0-9]*.[0-9]*\"/osx_minimum_system_version = \"${MIN_MACOS_VERSION}\"/" Cargo.toml
          sed -i -e "s/MACOSX_DEPLOYMENT_TARGET = [0-9]*.[0-9]*;/MACOSX_DEPLOYMENT_TARGET = ${MIN_MACOS_VERSION};/" flutter/macos/Runner.xcodeproj/project.pbxproj
          ./build.py --flutter --hwcodec --unix-file-copy-paste --screencapturekit

      - name: Verify macOS app identity
        run: |
          APP="./flutter/build/macos/Build/Products/Release/RustDesk-Herbin.app"
          test -d "$APP"
          test "$(defaults read "$PWD/$APP/Contents/Info" CFBundleIdentifier)" = "com.herbin.rustdesk"
          test "$(defaults read "$PWD/$APP/Contents/Info" CFBundleName)" = "RustDesk-Herbin"

      - name: Ad-hoc sign app (not notarized)
        run: |
          APP="./flutter/build/macos/Build/Products/Release/RustDesk-Herbin.app"
          ENTITLEMENTS="$(mktemp)"
          cp flutter/macos/Runner/Release.entitlements "$ENTITLEMENTS"
          /usr/libexec/PlistBuddy -c 'Add :com.apple.security.cs.disable-library-validation bool true' "$ENTITLEMENTS" || \
            /usr/libexec/PlistBuddy -c 'Set :com.apple.security.cs.disable-library-validation true' "$ENTITLEMENTS"
          find "$APP/Contents/Frameworks" -type d -name '*.framework' -prune -print0 | while IFS= read -r -d '' framework; do
            codesign --force --sign - --options runtime "$framework"
          done
          find "$APP/Contents/Frameworks" -type f -name '*.dylib' -print0 | while IFS= read -r -d '' dylib; do
            codesign --force --sign - --options runtime "$dylib"
          done
          codesign --force --sign - --options runtime "$APP/Contents/MacOS/service"
          codesign --force --sign - --options runtime --entitlements "$ENTITLEMENTS" "$APP"
          codesign --verify --deep --strict --verbose=4 "$APP"
          rm -f "$ENTITLEMENTS"

      - name: Test macOS headless launcher before AppKit
        run: |
          python3 tests/test_macos_headless_launcher.py \
            ./flutter/build/macos/Build/Products/Release/RustDesk-Herbin.app

      - name: Create ad-hoc DMG
        run: |
          CREATE_DMG="$(command -v create-dmg)"
          CREATE_DMG="$(readlink -f "$CREATE_DMG")"
          sed -i -e 's/MAXIMUM_UNMOUNTING_ATTEMPTS=3/MAXIMUM_UNMOUNTING_ATTEMPTS=7/' "$CREATE_DMG"
          create-dmg \
            --icon "RustDesk-Herbin.app" 200 190 \
            --hide-extension "RustDesk-Herbin.app" \
            --window-size 800 400 \
            --app-drop-link 600 185 \
            "rustdesk-herbin-${VERSION}-aarch64.dmg" \
            "./flutter/build/macos/Build/Products/Release/RustDesk-Herbin.app"

      - name: Create checksum and build metadata
        run: |
          DMG="rustdesk-herbin-${VERSION}-aarch64.dmg"
          shasum -a 256 "$DMG" > "$DMG.sha256"
          {
            echo "artifact=$DMG"
            echo "upstream_version=$UPSTREAM_VERSION"
            echo "rdh_revision=$RDH_REVISION"
            echo "source_commit=$SOURCE_COMMIT"
            echo "signature=ad-hoc"
            echo "notarized=false"
          } > rdh-build-metadata.txt

      - name: Upload ad-hoc candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rustdesk-herbin-${{ env.VERSION }}-aarch64-adhoc
          path: |
            rustdesk-herbin-${{ env.VERSION }}-aarch64.dmg
            rustdesk-herbin-${{ env.VERSION }}-aarch64.dmg.sha256
            rdh-build-metadata.txt

      - name: Summarize candidate
        run: |
          {
            echo "## RustDesk-Herbin candidate"
            echo
            echo "- Upstream: \`${UPSTREAM_VERSION}\`"
            echo "- RDH revision: \`${RDH_REVISION}\`"
            echo "- Artifact: \`rustdesk-herbin-${VERSION}-aarch64.dmg\`"
            echo "- Signature: ad-hoc (not notarized; Gatekeeper acceptance is not claimed)"
            echo "- Source: \`${SOURCE_COMMIT}\`"
          } >> "$GITHUB_STEP_SUMMARY"
