name: Flutter Tag Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-[0-9]+'
      # Padrão de tag do fork Rech Rustdesk, ex.: 1.4.9-rech.1
      # (ver docs/AUTOMACAO-SYNC-RELEASE.md, seção 3.2). Mantido como um
      # padrão a mais, separado dos originais acima, para reduzir conflito
      # em futuros syncs com o upstream nesse mesmo arquivo.
      - '[0-9]+.[0-9]+.[0-9]+-rech.[0-9]+'

jobs:
  run-flutter-tag-build:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    with:
      upload-artifact: true
      upload-tag: ${{ github.ref_name }}
      publish-update-metadata: ${{ github.repository == 'rustdesk/rustdesk' }}
