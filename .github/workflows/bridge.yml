# This yaml shares the build bridge steps with ci and nightly.
name: Build flutter-rust-bridge
# 2023-11-23 18:00:00+00:00

on:
  workflow_call:
    inputs:
      flutter_bridge_default_version:
        description: "Default Flutter version to generate bridge with (like '3.22.3')"
        type: string
        required: true
      flutter_bridge_arm64_version:
        description: "Flutter version to generate ARM64 bridge with (like '3.44.9')"
        type: string
        required: true

env:
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  RUST_VERSION: "1.75" # https://github.com/rustdesk/rustdesk/discussions/7503

jobs:
  generate_bridge_matrix:
    runs-on: ubuntu-22.04
    outputs:
      job: ${{ steps.define-matrix.outputs.job }}
    env:
      FLUTTER_BRIDGE_DEFAULT_VERSION: ${{ inputs.flutter_bridge_default_version }}
      FLUTTER_BRIDGE_ARM64_VERSION: ${{ inputs.flutter_bridge_arm64_version }}
    steps:
      - name: Generate bridge matrix
        id: define-matrix
        shell: bash
        run: |
          MATRIX_JSON="[
            {
              \"desc\": \"Default bridge for every platform still on Flutter 3.24.5 (generated with 3.22.3).\",
              \"target\": \"x86_64-unknown-linux-gnu\",
              \"os\": \"ubuntu-22.04\",
              \"extra-build-args\": \"\",
              \"flutter-version\": \"${FLUTTER_BRIDGE_DEFAULT_VERSION}\",
              \"artifact-name\": \"bridge-artifact\"
            },
            {
              \"desc\": \"Dedicated bridge for the Windows arm64 build (Flutter 3.44); runs in parallel.\",
              \"target\": \"x86_64-unknown-linux-gnu\",
              \"os\": \"ubuntu-22.04\",
              \"extra-build-args\": \"\",
              \"flutter-version\": \"${FLUTTER_BRIDGE_ARM64_VERSION}\",
              \"artifact-name\": \"bridge-artifact-flutter-3.44\"
            }
          ]"
          MATRIX_JSON_COMPACT="$(echo "${MATRIX_JSON}" | jq -r 'tojson')"
          echo "job=${MATRIX_JSON_COMPACT}" >> "${GITHUB_OUTPUT}"

  generate_bridge:
    needs: [generate_bridge_matrix]
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.generate_bridge_matrix.outputs.job) }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install prerequisites
        run: |
          sudo apt-get install ca-certificates -y
          sudo apt-get update -y
          sudo apt-get install -y \
            clang \
            cmake \
            curl \
            gcc \
            git \
            g++ \
            libclang-dev \
            libgtk-3-dev \
            llvm-dev \
            nasm \
            ninja-build \
            pkg-config \
            wget

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: bridge-${{ matrix.job.os }}

      - name: Cache Bridge
        id: cache-bridge
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: /tmp/flutter_rust_bridge
          key: bridge-${{ matrix.job.flutter-version }}

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ matrix.job.flutter-version }}
          cache: true

      - name: Install flutter rust bridge deps
        shell: bash
        env:
          FLUTTER_BRIDGE_VERSION: ${{ matrix.job.flutter-version }}
        run: |
          cargo install cargo-expand --version "${CARGO_EXPAND_VERSION}" --locked
          cargo install flutter_rust_bridge_codegen --version "${FLUTTER_RUST_BRIDGE_VERSION}" --features "uuid" --locked
          case "${FLUTTER_BRIDGE_VERSION}" in
          3.22.*)
            # Default Flutter 3.22.3: extended_text 14 needs a newer Dart, so downgrade for resolution.
            sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
            ;;
          3.44.*)
            # Flutter 3.44 bridge for Windows arm64: match that build's source/pubspec state so the
            # generated *.freezed.dart compiles against the same Flutter/freezed it resolves.
            bash .github/patches/apply_flutter_3.44_source_patches.sh
            ;;
          *)
            # basilgello: Bail out as we dont know which version of flutter to use
            # This requires devs to add the correct Flutter version into
            # the matrix above and regenerate lockfile if it is not there yet
            # or if it is outdated
            echo "ERROR: Unknown Flutter version to build the bridge!"
            echo ""
            echo "Please see bridge.yml for instructions!"
            echo ""
            exit 1
            ;;
          esac
          # Set proper bridge lockfile in place and try to get packages locked
          python3 flutter/flutter_pub_get.py get-packages "flutter/pubspec-bridge-${FLUTTER_BRIDGE_VERSION}.lock"

      - name: Run flutter rust bridge
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.job.artifact-name }}
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h
            ./flutter/ios/Runner/bridge_generated.h
