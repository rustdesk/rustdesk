# This yaml shares the build bridge steps with ci and nightly.
name: Build flutter-rust-bridge
# 2023-11-23 18:00:00+00:00

on:
  workflow_call:

env:
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  RUST_VERSION: "1.75" # https://github.com/rustdesk/rustdesk/discussions/7503

jobs:
  generate_bridge:
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          # Default bridge for every platform still on Flutter 3.24.5 (generated with 3.22.3).
          - {
              target: x86_64-unknown-linux-gnu,
              os: ubuntu-22.04,
              extra-build-args: "",
              flutter-version: "3.22.3",
              artifact-name: "bridge-artifact",
            }
          # Dedicated bridge for the Windows arm64 build (Flutter 3.44); runs in parallel.
          - {
              target: x86_64-unknown-linux-gnu,
              os: ubuntu-22.04,
              extra-build-args: "",
              flutter-version: "3.44.8",
              artifact-name: "bridge-artifact-flutter-3.44",
            }
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install prerequisites
        run: |
          sudo apt-get install ca-certificates -y
          sudo apt-get update -y
          sudo apt-get install -y \
            clang \
            cmake \
            curl \
            gcc \
            git \
            g++ \
            libclang-dev \
            libgtk-3-dev \
            llvm-dev \
            nasm \
            ninja-build \
            pkg-config \
            wget

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: bridge-${{ matrix.job.os }}

      - name: Cache Bridge
        id: cache-bridge
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: /tmp/flutter_rust_bridge
          key: bridge-${{ matrix.job.flutter-version }}

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ matrix.job.flutter-version }}
          cache: true

      - name: Install flutter rust bridge deps
        shell: bash
        env:
          FLUTTER_BRIDGE_VERSION: ${{ matrix.job.flutter-version }}
        run: |
          cargo install cargo-expand --version "${CARGO_EXPAND_VERSION}" --locked
          cargo install flutter_rust_bridge_codegen --version "${FLUTTER_RUST_BRIDGE_VERSION}" --features "uuid" --locked
          if [ "${FLUTTER_BRIDGE_VERSION}" == "3.22.3" ]; then
            # Default Flutter 3.22.3: extended_text 14 needs a newer Dart, so downgrade for resolution.
            sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          elif [ "${FLUTTER_BRIDGE_VERSION}" == "3.44.8" ]; then
            # Flutter 3.44 bridge for Windows arm64: match that build's source/pubspec state so the
            # generated *.freezed.dart compiles against the same Flutter/freezed it resolves.
            bash .github/patches/apply_flutter_3.44_source_patches.sh
          else
            # basilgello: Bail out as we dont know which version of flutter to use
            # This requires devs to add the correct Flutter version into
            # the matrix above and regenerate lockfile if it is not there yet
            # or if it is outdated
            echo "ERROR: Unknown Flutter version to build the bridge!"
            echo ""
            echo "Please see bridge.yml for instructions!"
            echo ""
            exit 1
          fi
          # Set proper bridge lockfile in place and try to get packages locked
          BRIDGE_LOCKFILE_EXISTS=1
          BRIDGE_LOCKFILE_DIFFERS=0
          if [ -f "flutter/pubspec-bridge-${FLUTTER_BRIDGE_VERSION}.lock" ]; then
            # basilgello: Copy bridge lockfile into pubspec.lock and let
            # `flutter packages pub get` check it
            cp "flutter/pubspec-bridge-${FLUTTER_BRIDGE_VERSION}.lock" "flutter/pubspec.lock"
          else
            BRIDGE_LOCKFILE_EXISTS=0
          fi
          pushd flutter
          if ! flutter packages pub get --enforce-lockfile; then
            # basilgello: re-generate lockfile and abort the workflow with error
            # to signal the devs that pubspec-bridge.lock differs from the
            # generated one
            flutter packages pub get
            if [ "${BRIDGE_LOCKFILE_EXISTS}" -eq 0 ]; then
              echo "ERROR: Lockfile 'pubspec-bridge-${FLUTTER_BRIDGE_VERSION}.lock' does not exist!"
              echo ""
              echo "Maybe Flutter version used for bridge generation was bumped?"
              echo ""
              echo "If so, check the contents of file below and copy them"
              echo "to 'pubspec-bridge-${FLUTTER_BRIDGE_VERSION}.lock'!"
              echo ""
            fi
            if ! git diff --quiet --exit-code "pubspec.lock" "pubspec-bridge-${FLUTTER_BRIDGE_VERSION}.lock"; then
              BRIDGE_LOCKFILE_DIFFERS=1

              echo "ERROR: Lockfile 'pubspec-bridge-${FLUTTER_BRIDGE_VERSION}.lock' differs!"
              echo ""
              echo "Lockfile 'pubspec.lock' generated with 'pubspec.yaml'"
              echo "patched for Flutter version ${FLUTTER_BRIDGE_VERSION}"
              echo "differs from what we locked in the repository"
              echo "(pubspec-bridge-${FLUTTER_BRIDGE_VERSION}.lock)"
              echo ""
              echo "Please verify manually if the new dependencies are OK"
              echo "and copy the regenerated 'pubspec.lock' file into"
              echo "'pubspec-bridge-${FLUTTER_BRIDGE_VERSION}.lock'"
              echo "then commit and PR it!"
              echo ""
            fi
            if [ "${BRIDGE_LOCKFILE_EXISTS}" -eq 0 ] || [ "${BRIDGE_LOCKFILE_DIFFERS}" -eq 1 ]; then
              echo "Contents of pubspec.lock:"
              echo "=========================="
              cat pubspec.lock
              echo "=========================="
              echo ""

              exit 1
            fi
          fi
          popd

      - name: Run flutter rust bridge
        run: |
          ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.job.artifact-name }}
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h
            ./flutter/ios/Runner/bridge_generated.h
