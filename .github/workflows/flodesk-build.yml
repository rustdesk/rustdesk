# copy to <your-rustdesk-fork>/.github/workflows/flodesk-build.yml
name: flodesk-build
on:
  push: { branches: [flodesk], tags: ['v*'] }
  workflow_dispatch:
env:
  RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  NDK_VERSION: "r28c"
  CARGO_NDK_VERSION: "3.1.2"
  RENDEZVOUS: ${{ vars.FLODESK_SERVER || 'rd.asandesk.ir' }}
  RS_KEY: ${{ vars.FLODESK_PUBKEY || 'joRoqzc0SDOHe61V9WrRORk4PqBVzBntfGtzveM3h8M=' }}
permissions: { contents: write }
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: "${{ env.FLUTTER_VERSION }}" }
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "${{ env.RUST_VERSION }}-x86_64-pc-windows-msvc" }
      - uses: Swatinem/rust-cache@v2
      - name: Install LLVM + ImageMagick
        shell: pwsh
        run: |
          choco install -y llvm imagemagick --no-progress
          $d = Get-ChildItem 'C:\Program Files\ImageMagick-*' -Directory | Select-Object -First 1
          if ($d) { $d.FullName | Out-File -Append -Encoding utf8 $env:GITHUB_PATH }
      - uses: lukka/run-vcpkg@v11
        with: { vcpkgGitCommitId: "${{ env.VCPKG_COMMIT_ID }}", doNotCache: false }
      - name: Install vcpkg dependencies
        shell: bash
        env: { VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static }
        run: |
          "$VCPKG_ROOT/vcpkg" install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"
      - name: Verify ImageMagick + logo
        shell: bash
        run: |
          ls -l flodesk/logo.png
          magick --version | head -1
      - name: Rebrand
        shell: bash
        run: bash flodesk/rebrand.sh . flodesk/logo.png "$RENDEZVOUS" "$RS_KEY"
      - name: Build
        shell: bash
        run: |
          python3 -m pip install --user requests
          flutter pub get --directory flutter
          python3 build.py --portable --hwcodec --flutter --vram --skip-portable-pack || python3 build.py --flutter
        env: { VCPKG_ROOT: "${{ env.VCPKG_ROOT }}" }
      - name: Collect
        shell: bash
        run: |
          mkdir out
          cp -r flutter/build/windows/x64/runner/Release out/FloDesk-win
          [ -f out/FloDesk-win/rustdesk.exe ] && mv out/FloDesk-win/rustdesk.exe out/FloDesk-win/FloDesk.exe
          7z a FloDesk-windows-x64.zip ./out/FloDesk-win
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: FloDesk-windows-x64.zip }
  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: "${{ env.FLUTTER_VERSION }}" }
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: nttld/setup-ndk@v1
        id: ndk
        with: { ndk-version: "${{ env.NDK_VERSION }}", add-to-path: true }
      - run: |
          sudo apt-get update && sudo apt-get install -y imagemagick clang cmake ninja-build pkg-config nasm
          cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked
      - name: Verify ImageMagick + logo
        shell: bash
        run: |
          ls -l flodesk/logo.png
          convert --version | head -1
      - name: Rebrand
        shell: bash
        run: bash flodesk/rebrand.sh . flodesk/logo.png "$RENDEZVOUS" "$RS_KEY"
      - name: "Build (vcpkg deps + native libs, mirrors upstream flutter-build.yml android job)"
        run: |
          git clone https://github.com/microsoft/vcpkg /opt/vcpkg && cd /opt/vcpkg && git checkout $VCPKG_COMMIT_ID && ./bootstrap-vcpkg.sh
          cd $GITHUB_WORKSPACE
          export VCPKG_ROOT=/opt/vcpkg ANDROID_NDK_HOME=${{ steps.ndk.outputs.ndk-path }}
          for t in arm64-android arm-neon-android; do $VCPKG_ROOT/vcpkg install --triplet $t --x-install-root=$VCPKG_ROOT/installed; done
          ln -sfn $VCPKG_ROOT/installed/arm-neon-android $VCPKG_ROOT/installed/arm-android
          cd flutter && flutter pub get && cd ..
          ./flutter/ndk_arm64.sh && ./flutter/ndk_arm.sh
          mkdir -p flutter/android/app/src/main/jniLibs/{arm64-v8a,armeabi-v7a}
          cp target/aarch64-linux-android/release/liblibrustdesk.so flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so
          cp target/armv7-linux-androideabi/release/liblibrustdesk.so flutter/android/app/src/main/jniLibs/armeabi-v7a/librustdesk.so
          cd flutter && flutter build apk --release --target-platform android-arm,android-arm64 --split-per-abi=false
          cp build/app/outputs/flutter-apk/app-release.apk ../FloDesk.apk
      - uses: actions/upload-artifact@v4
        with: { name: android, path: FloDesk.apk }
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with: { files: dist/* }
