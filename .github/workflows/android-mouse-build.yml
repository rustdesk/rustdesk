name: Inspect RustDesk Android Mouse

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout RustDesk 1.4.9
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: 1.4.9
          submodules: recursive

      - name: Search mouse and cursor code
        run: |
          {
            echo "=== POINTER CAPTURE ==="
            grep -R -n \
              -e "requestPointerCapture" \
              -e "releasePointerCapture" \
              -e "pointerCapture" \
              android flutter 2>/dev/null || true

            echo
            echo "=== VIEW ONLY ==="
            grep -R -n \
              -e "viewOnly" \
              -e "view_only" \
              -e "ViewOnly" \
              flutter/lib android 2>/dev/null || true

            echo
            echo "=== CURSOR ==="
            grep -R -n \
              -e "show-my-cursor" \
              -e "SystemMouseCursors" \
              -e "MouseRegion" \
              -e "PointerDeviceKind.mouse" \
              flutter/lib android 2>/dev/null || true

            echo
            echo "=== INPUT MODEL ==="
            grep -R -n \
              -e "sendMouse" \
              -e "sendPointer" \
              -e "handleMouse" \
              -e "mouseEvent" \
              flutter/lib android 2>/dev/null || true
          } | tee mouse-search.txt

      - name: Upload search results
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-mouse-search
          path: mouse-search.txt
