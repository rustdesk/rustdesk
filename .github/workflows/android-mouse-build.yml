name: Patch RustDesk Android Mouse

on:
  workflow_dispatch:

jobs:
  patch-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout RustDesk 1.4.9
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: 1.4.9
          submodules: recursive

      - name: Keep Android local mouse cursor visible
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("flutter/lib/mobile/pages/remote_page.dart")
          s = p.read_text()

          old = """cursor: ffiModel.keyboard ? SystemMouseCursors.none : MouseCursor.defer,"""
          new = """cursor: MouseCursor.defer,"""

          if old not in s:
              raise SystemExit("Target cursor line not found")

          s = s.replace(old, new, 1)
          p.write_text(s)

          print("Patch applied successfully.")
          PY

      - name: Show patched section
        run: |
          grep -n -A5 -B5 "cursor: MouseCursor.defer" \
            flutter/lib/mobile/pages/remote_page.dart

      - name: Save patched source
        uses: actions/upload-artifact@v4
        with:
          name: patched-remote-page
          path: flutter/lib/mobile/pages/remote_page.dart
