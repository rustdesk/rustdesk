[package]
name = "rustdesk"
version = "1.5.0"
authors = ["rustdesk <info@rustdesk.com>"]
edition = "2021"
build = "build.rs"
description = "RustDesk Remote Desktop"
license = "AGPL-3.0"
repository = "https://github.com/rustdesk/rustdesk"
homepage = "https://rustdesk.com"
keywords = ["remote-desktop", "rdp", "vnc"]
categories = ["network-programming", "gui"]
readme = "README.md"

# ---------------------------------------------------------------------------
# Dependencies
# ---------------------------------------------------------------------------
[dependencies]
# ... other dependencies ...

# cpal is used for audio capture/playback. Enable the ASIO backend on Windows
# to allow proper routing of audio streams on devices that expose an ASIO
# interface (e.g., Astro MixAmp Pro). The `asio` feature is only compiled on
# Windows; on other platforms it is ignored.
cpal = { version = "0.15", default-features = false, features = ["asio"], optional = false }

# ---------------------------------------------------------------------------
# Optional features
# ---------------------------------------------------------------------------
[features]
default = ["cpal"]
# other feature flags ...

